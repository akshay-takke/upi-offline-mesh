spring:
  application:
    name: upi-offline-mesh

    datasource:
      url: jdbc:postgresql://localhost:5432/upi_mesh_db
      username: ${DB_USERNAME:akshay}
      password: $DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: update
        show-sql: false
        properties:
          hibernate:
            format_sql: true

    server:
      port:8080

    management:
      endpoints:
        web:
          exposure:
            include: health, info
      endpoint:
        health:
          show-details: never

    logging:
      level:
        com.demo.upimesh: INFO