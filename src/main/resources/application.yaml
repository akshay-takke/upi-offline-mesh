
spring:
  application:
    name: upi-offline-mesh

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/upi_mesh_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080